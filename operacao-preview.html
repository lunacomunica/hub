<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operação — Luna</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#0f172a;color:#cbd5e1;font-size:13px;min-height:100vh}

/* ── TOP BAR ─────────────────────────────────────────── */
.topbar{
  height:48px;background:#1e293b;border-bottom:1px solid rgba(255,255,255,0.06);
  display:flex;align-items:center;gap:12px;padding:0 20px;
  position:sticky;top:0;z-index:300;
}
.logo{font-weight:800;font-size:14px;color:#60a5fa;letter-spacing:-.3px;margin-right:4px}
.logo span{color:#475569;font-weight:400}

.tabs{display:flex;gap:2px}
.tab{
  padding:5px 14px;border-radius:6px;border:none;
  background:transparent;color:#475569;font-size:12px;font-weight:600;
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.tab:hover{color:#94a3b8}
.tab.active{background:rgba(59,130,246,.15);color:#60a5fa}

.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}

.btn{
  padding:5px 13px;border-radius:6px;border:none;cursor:pointer;
  font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;
  transition:all .15s;white-space:nowrap;
}
.btn-primary{background:#3b82f6;color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-ghost{background:rgba(255,255,255,0.05);color:#64748b;border:1px solid rgba(255,255,255,.07)}
.btn-ghost:hover{color:#94a3b8;background:rgba(255,255,255,.08)}
.btn-danger{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.2)}
.btn-danger:hover{background:rgba(239,68,68,.2)}

/* ── TYPE PILLS (small) ───────────────────────────────── */
.pill{
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;
  border:1px solid transparent;white-space:nowrap;
}
.p-cap  {background:rgba(20,83,45,.35);  color:#4ade80;border-color:rgba(74,222,128,.2)}
.p-plan {background:rgba(30,58,138,.35); color:#93c5fd;border-color:rgba(147,197,253,.2)}
.p-edit {background:rgba(74,29,150,.35); color:#c4b5fd;border-color:rgba(196,181,253,.2)}
.p-des  {background:rgba(120,53,15,.35); color:#fcd34d;border-color:rgba(252,211,77,.2)}
.p-rev  {background:rgba(127,29,29,.35); color:#fca5a5;border-color:rgba(252,165,165,.2)}
.p-big  {background:rgba(30,58,138,.4);  color:#93c5fd;border-color:rgba(59,130,246,.3)}
.p-other{background:rgba(55,65,81,.35);  color:#94a3b8;border-color:rgba(148,163,184,.15)}
.p-mrr  {background:rgba(16,185,129,.1); color:#34d399;border-color:rgba(52,211,153,.2)}
.p-tcv  {background:rgba(99,102,241,.1); color:#818cf8;border-color:rgba(129,140,248,.2)}
.p-cap-freq{background:rgba(245,158,11,.1);color:#fbbf24;border-color:rgba(251,191,36,.2)}

/* ══════════════════════════════════════════════════════
   PAUTA — SPRINT + MÊS
══════════════════════════════════════════════════════ */
#cal-section{display:none}

/* ── View toggle ──────────────────────────────────────────── */
.view-toggle{display:flex;gap:3px}
.vbtn{
  padding:4px 12px;border-radius:6px;
  border:1px solid rgba(255,255,255,.08);
  background:transparent;color:#475569;font-size:11px;font-weight:600;
  cursor:pointer;transition:all .15s;
}
.vbtn.active{background:rgba(59,130,246,.15);color:#60a5fa;border-color:rgba(59,130,246,.3)}
.vbtn:hover:not(.active){color:#94a3b8;background:rgba(255,255,255,.05)}

/* ── Cal-header (shared) ──────────────────────────────── */
.cal-header{
  display:flex;align-items:center;gap:10px;
  padding:12px 20px 10px;border-bottom:1px solid rgba(255,255,255,.05);
  flex-wrap:wrap;
}
.cal-month-lbl{font-size:16px;font-weight:800;color:#f1f5f9}
.nav-btn{
  width:28px;height:28px;border-radius:6px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);color:#475569;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;
}
.nav-btn:hover{color:#94a3b8;background:rgba(255,255,255,.08)}
.today-btn{
  font-size:11px;font-weight:600;color:#475569;padding:4px 10px;
  border:1px solid rgba(255,255,255,.08);border-radius:6px;background:transparent;cursor:pointer;
  transition:all .15s;
}
.today-btn:hover{color:#94a3b8}

/* ── Captação alert ───────────────────────────────────── */
.cap-alert{
  display:flex;align-items:center;gap:8px;
  padding:7px 20px;background:rgba(245,158,11,.06);
  border-bottom:1px solid rgba(245,158,11,.12);font-size:11px;color:#92400e;
  flex-wrap:wrap;
}
.cap-alert-item{
  display:flex;align-items:center;gap:5px;
  background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);
  border-radius:6px;padding:3px 9px;color:#fbbf24;font-weight:600;cursor:pointer;
}
.cap-alert-item:hover{background:rgba(245,158,11,.18)}

/* ══ SPRINT VIEW ═══════════════════════════════════════ */
.pt-outer{overflow-x:auto}
.pt-inner{padding:0 16px 16px;display:inline-block;min-width:100%}

.pt-spr-header{
  display:flex;
  position:sticky;top:48px;z-index:100;
  background:#0f172a;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.pt-spr-hlabel{
  width:120px;min-width:120px;flex-shrink:0;
  padding:6px 10px;font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;color:#1e3a5f;
  border-right:2px solid #1e3a5f;
}
.pt-spr-hdays{display:flex;flex:1}
.pt-spr-hday{
  flex:1;min-width:100px;text-align:center;
  padding:5px 4px;border-left:1px solid rgba(255,255,255,.04);
  line-height:1.4;
}
.pt-spr-hday .dc-dow{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#475569;display:block}
.pt-spr-hday .dc-num{font-size:15px;font-weight:800;color:#64748b;display:block}
.pt-spr-hday.we .dc-dow{color:#243044}
.pt-spr-hday.we .dc-num{color:#2d3f55}
.pt-spr-hday.today-col .dc-dow{color:#93c5fd}
.pt-spr-hday.today-col .dc-num{color:#60a5fa}
.pt-spr-hday.today-col{background:rgba(59,130,246,.07)}

.pt-spr-row{
  display:flex;align-items:stretch;
  border-bottom:1px solid rgba(255,255,255,.04);
}
.pt-spr-row:last-child{border-bottom:none}
.pt-spr-name{
  width:120px;min-width:120px;flex-shrink:0;
  background:#1a2744;
  padding:4px 10px;display:flex;align-items:center;
  font-size:12px;font-weight:600;color:#e2e8f0;
  border-right:2px solid #243860;
  position:sticky;left:0;z-index:10;
}
.pt-spr-cells{display:flex;flex:1}
.pt-spr-cell{
  flex:1;min-width:110px;
  border-left:1px solid rgba(255,255,255,.04);
  transition:background .1s;
  display:flex;flex-direction:column;
  min-height:84px;
}
.pt-spr-cell.we{background:rgba(0,0,0,.07)}
.pt-spr-cell.today-col{background:rgba(59,130,246,.03)}

/* Manhã / Tarde halves */
.pt-period{
  flex:1;display:flex;flex-direction:column;gap:2px;
  padding:3px 3px 3px;min-height:42px;
  cursor:pointer;transition:background .1s;
}
.pt-period:hover{background:rgba(59,130,246,.06)}
.pt-period.p-manha{border-bottom:1px solid rgba(255,255,255,.05)}
.pt-period-hdr{
  display:flex;align-items:center;justify-content:space-between;
  font-size:8px;font-weight:700;color:#334155;
  text-transform:uppercase;letter-spacing:.05em;
  margin-bottom:2px;padding:0 2px;line-height:1;
}
.ph-hrs{font-size:8px;font-weight:600;color:#475569}
.ph-hrs.f{color:#fbbf24}
.ph-hrs.ov{color:#f87171}

/* Task card in sprint view */
.pt-card{
  display:flex;align-items:center;gap:3px;
  padding:3px 6px;border-radius:4px;
  font-size:10px;font-weight:600;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  cursor:pointer;border:none;width:100%;text-align:left;
  transition:filter .1s;font-family:inherit;line-height:1.5;
}
.pt-card:hover{filter:brightness(1.3)}
.pt-card .ci{font-size:9px;flex-shrink:0}
.pt-card .cn{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.pt-card .ch{font-size:8px;opacity:.6;flex-shrink:0;margin-left:2px}
.pt-card.p-cap  {background:rgba(20,83,45,.65);  color:#4ade80}
.pt-card.p-plan {background:rgba(30,58,138,.65); color:#93c5fd}
.pt-card.p-edit {background:rgba(74,29,150,.65); color:#c4b5fd}
.pt-card.p-des  {background:rgba(120,53,15,.65); color:#fcd34d}
.pt-card.p-rev  {background:rgba(127,29,29,.65); color:#fca5a5}
.pt-card.p-other{background:rgba(55,65,81,.65);  color:#94a3b8}
.pt-card.p-big{
  background:linear-gradient(90deg,rgba(23,37,84,.9) 0%,rgba(30,58,138,.7) 100%);
  color:#93c5fd;font-weight:800;border:1px solid rgba(59,130,246,.4);
  justify-content:center;text-shadow:0 0 8px rgba(96,165,250,.4);
}

/* Add hint on cell hover */
.pt-add{font-size:10px;color:#334155;text-align:center;opacity:0;transition:opacity .1s;line-height:1;padding:1px 0}
.pt-period:hover .pt-add{opacity:1}

/* ══ MONTH VIEW ═════════════════════════════════════════ */
.pt-month-wrap{padding:0 16px 16px}
.pt-month-wkdays{
  display:grid;grid-template-columns:repeat(7,1fr);
  background:rgba(255,255,255,.02);border-radius:8px 8px 0 0;
}
.pt-month-wd{
  text-align:center;padding:6px 4px;
  font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:#334155;border-right:1px solid rgba(255,255,255,.04);
}
.pt-month-wd:last-child{border-right:none}
.pt-month-wd.we{color:#1e3a5f}

.pt-month-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.pt-month-day{
  border:1px solid rgba(255,255,255,.04);border-top:none;border-left:none;
  min-height:90px;padding:5px;cursor:pointer;transition:background .1s;position:relative;
}
.pt-month-day:nth-child(7n){border-right:none}
.pt-month-day:hover{background:rgba(59,130,246,.03)}
.pt-month-day.other-m{opacity:.3;pointer-events:none}
.pt-month-day.we-d{background:rgba(0,0,0,.05)}
.pt-month-day.today-d{box-shadow:inset 0 0 0 1px rgba(59,130,246,.5)}
.pt-month-dn{
  font-size:11px;font-weight:700;color:#475569;
  margin-bottom:4px;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
}
.pt-month-day.today-d .pt-month-dn{background:#3b82f6;color:#fff}

/* Month event rows */
.pt-mev{
  display:flex;align-items:center;gap:2px;
  padding:2px 5px;border-radius:3px;
  font-size:9px;font-weight:600;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  cursor:pointer;margin-bottom:2px;
  border-left:2px solid transparent;
  background:rgba(255,255,255,.04);color:#64748b;
  transition:background .1s;
}
.pt-mev:hover{background:rgba(255,255,255,.08)}
.pt-mev-p{font-size:8px;color:#334155;flex-shrink:0;font-weight:800;min-width:18px}
.pt-mev-i{font-size:8px;flex-shrink:0}
.pt-mev-l{overflow:hidden;text-overflow:ellipsis;flex:1}
.pt-mev.c-cap  {border-left-color:#4ade80;color:#86efac}
.pt-mev.c-plan {border-left-color:#93c5fd;color:#bfdbfe}
.pt-mev.c-edit {border-left-color:#c4b5fd;color:#ddd6fe}
.pt-mev.c-des  {border-left-color:#fcd34d;color:#fde68a}
.pt-mev.c-rev  {border-left-color:#fca5a5;color:#fecaca}
.pt-mev.c-other{border-left-color:#475569;color:#94a3b8}
.pt-mev.c-big{
  border-left:none;border:1px solid rgba(59,130,246,.4);
  background:linear-gradient(90deg,rgba(23,37,84,.85) 0%,rgba(30,58,138,.55) 100%);
  color:#93c5fd;font-weight:800;justify-content:center;
  text-shadow:0 0 8px rgba(96,165,250,.4);margin-top:2px;
}
.pt-more{font-size:9px;color:#334155;cursor:pointer;padding:0 3px}
.pt-more:hover{color:#64748b}

.pt-hint{padding:8px 0 4px;font-size:10px;color:#1e3a5f}

/* ══════════════════════════════════════════════════════
   CLIENTES / CAPACIDADE
══════════════════════════════════════════════════════ */
#clients-section{display:none}

.clients-toolbar{
  display:flex;align-items:center;gap:8px;
  padding:10px 20px;border-bottom:1px solid rgba(255,255,255,.05);
  flex-wrap:wrap;
}
.cl-search{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:7px;padding:5px 10px;flex:1;min-width:180px;max-width:280px;
}
.cl-search input{
  background:none;border:none;outline:none;color:#e2e8f0;font-size:12px;width:100%;
}
.cl-search input::placeholder{color:#334155}
.cl-search span{color:#334155;font-size:12px;flex-shrink:0}

.cl-filters{display:flex;gap:5px;flex-wrap:wrap}
.cl-filter-btn{
  padding:4px 11px;border-radius:20px;border:1px solid rgba(255,255,255,.08);
  background:transparent;color:#475569;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;
}
.cl-filter-btn:hover{color:#94a3b8;border-color:rgba(255,255,255,.15)}
.cl-filter-btn.active{background:rgba(59,130,246,.15);color:#60a5fa;border-color:rgba(59,130,246,.3)}
.cl-filter-btn.warn{background:rgba(239,68,68,.1);color:#f87171;border-color:rgba(239,68,68,.25)}

.cl-stats{
  margin-left:auto;display:flex;gap:14px;font-size:11px;color:#334155;
}
.cl-stats strong{color:#64748b}

/* Table */
.cl-table-wrap{overflow-x:auto;padding:0 0 16px}
.cl-table{
  width:100%;border-collapse:collapse;font-size:12px;
}
.cl-table th{
  padding:7px 12px;font-size:9px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:#334155;border-bottom:1px solid rgba(255,255,255,.06);
  text-align:left;white-space:nowrap;cursor:pointer;user-select:none;
  position:sticky;top:48px;background:#0f172a;z-index:10;
}
.cl-table th:hover{color:#64748b}
.cl-table th.sorted{color:#60a5fa}

.cl-table td{
  padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.035);
  vertical-align:middle;
}
.cl-table tr:hover td{background:rgba(255,255,255,.02)}
.cl-table tr.mrr-row:hover td{background:rgba(59,130,246,.04)}
.cl-table tr.tcv-row:hover td{background:rgba(99,102,241,.04)}

.cl-name{font-weight:700;color:#e2e8f0;white-space:nowrap}
.cl-sub{font-size:10px;color:#475569;margin-top:1px}

/* Hours mini display */
.hrs-chips{display:flex;gap:3px;flex-wrap:wrap}
.hrs-chip{
  font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px;
  border:1px solid transparent;white-space:nowrap;
}

/* Cap status cell */
.cap-status{display:flex;align-items:center;gap:5px;white-space:nowrap}
.cap-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cap-ok   .cap-dot{background:#4ade80}
.cap-soon .cap-dot{background:#fbbf24}
.cap-due  .cap-dot{background:#f87171;box-shadow:0 0 4px rgba(248,113,113,.5)}
.cap-none .cap-dot{background:#334155}
.cap-txt{font-size:11px;color:#64748b}
.cap-next{font-size:10px;color:#334155}

/* Progress bar inline */
.prog-wrap{display:flex;align-items:center;gap:6px;min-width:100px}
.prog-bar{flex:1;height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;min-width:50px}
.prog-fill{height:100%;border-radius:2px;transition:width .3s}
.pf-ok  {background:#4ade80}
.pf-warn{background:#fbbf24}
.pf-over{background:#f87171}
.prog-lbl{font-size:10px;font-weight:600;white-space:nowrap}
.pl-ok  {color:#4ade80}
.pl-warn{color:#fbbf24}
.pl-over{color:#f87171}

.row-action{
  opacity:0;background:none;border:none;color:#475569;cursor:pointer;
  font-size:11px;padding:3px 6px;border-radius:4px;transition:all .15s;
}
.cl-table tr:hover .row-action{opacity:1}
.row-action:hover{color:#93c5fd;background:rgba(59,130,246,.12)}

.cl-empty{
  text-align:center;padding:40px;color:#334155;font-size:13px;
}

/* Add row */
.cl-add-row{
  display:flex;align-items:center;gap:7px;padding:9px 12px;
  color:#1e3a5f;font-size:11px;cursor:pointer;border-radius:0;
  transition:all .15s;border-top:1px solid rgba(255,255,255,.04);
  border-bottom:none;background:transparent;width:100%;
}
.cl-add-row:hover{color:#334155;background:rgba(255,255,255,.02)}

/* Section divider in table */
.cl-section-row td{
  padding:4px 12px 2px;font-size:9px;font-weight:800;text-transform:uppercase;
  letter-spacing:.1em;color:#1e3a5f;background:#0f172a !important;border-bottom:none;
}

.f-cap {background:#4ade80}
.f-plan{background:#93c5fd}
.f-edit{background:#c4b5fd}
.f-des {background:#fcd34d}
.f-rev {background:#fca5a5}

/* ══════════════════════════════════════════════════════
   META | PADRÃO (Gantt)
══════════════════════════════════════════════════════ */
#meta-section{display:none}

.grid-wrap{padding:16px;overflow-x:auto}
.grid-inner{min-width:960px}

/* Sprint header */
.g-sprints{
  display:grid;
  grid-template-columns:160px repeat(5,1fr) 3px repeat(5,1fr) 3px repeat(5,1fr) 3px repeat(5,1fr) 60px;
  margin-bottom:2px;
}
.gs-spr{
  text-align:center;font-size:9px;font-weight:800;
  text-transform:uppercase;letter-spacing:.08em;padding:3px 0;border-radius:3px;
  grid-column:span 5;
}
.s1{color:#60a5fa;background:rgba(59,130,246,.06)}
.s2{color:#818cf8;background:rgba(99,102,241,.06)}
.s3{color:#a78bfa;background:rgba(139,92,246,.06)}
.s4{color:#c084fc;background:rgba(192,132,252,.06)}
.gs-sep{width:3px}

/* Day header */
.g-header{
  display:grid;
  grid-template-columns:160px repeat(5,1fr) 3px repeat(5,1fr) 3px repeat(5,1fr) 3px repeat(5,1fr) 60px;
  margin-bottom:2px;
}
.gh-lbl{padding:5px 10px;font-size:9px;font-weight:700;color:#334155;text-transform:uppercase;letter-spacing:.06em}
.gh-day{
  background:#172033;color:#4e7194;text-align:center;
  padding:4px 1px;font-size:10px;font-weight:600;
  border-right:1px solid rgba(255,255,255,.03);
}
.gh-day.fst{border-radius:4px 0 0 4px}
.gh-day.lst{border-right:none;border-radius:0 4px 4px 0}
.gh-sep{width:3px}
.gh-cap{font-size:9px;color:#334155;text-align:center;padding:4px}

/* Row */
.g-row{
  display:grid;
  grid-template-columns:160px 1fr 60px;
  margin-bottom:2px;min-height:42px;align-items:stretch;
}
.g-row:hover .rn{background:rgba(59,130,246,.05)}
.rn{
  background:#1a2744;border-radius:6px 0 0 6px;
  padding:0 10px;display:flex;align-items:center;justify-content:space-between;
  font-weight:600;font-size:12px;color:#94a3b8;
  border-right:2px solid #1e3a5f;transition:background .12s;
  user-select:none;min-height:42px;gap:4px;
}
.rn-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rn-btn{
  opacity:0;background:none;border:none;color:#334155;cursor:pointer;
  font-size:10px;padding:2px 4px;border-radius:4px;transition:all .15s;flex-shrink:0;
}
.g-row:hover .rn-btn{opacity:1}
.rn-btn:hover{color:#93c5fd;background:rgba(59,130,246,.12)}

.row-days{
  position:relative;
  display:grid;
  grid-template-columns:repeat(5,1fr) 3px repeat(5,1fr) 3px repeat(5,1fr) 3px repeat(5,1fr);
  background:rgba(255,255,255,.01);min-height:42px;
}
.day-cell{
  border-right:1px solid rgba(255,255,255,.025);cursor:crosshair;
  transition:background .1s;min-height:42px;z-index:1;
}

// CALENDAR UTILS
// ──────────────────────────────────────────────────────────
function dstr(d){ return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}` }
function z(n){ return String(n).padStart(2,'0') }
function calY(){ return +document.getElementById('cal-month').value.split('-')[0] }
function calM(){ return +document.getElementById('cal-month').value.split('-')[1] }
function calShift(d){ const dt=new Date(calY(),calM()-1+d,1); document.getElementById('cal-month').value=`${dt.getFullYear()}-${z(dt.getMonth()+1)}`; }
function calToday(){ const n=new Date(); document.getElementById('cal-month').value=`${n.getFullYear()}-${z(n.getMonth()+1)}`; }

// ──────────────────────────────────────────────────────────
const PT_M=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CAP_FREQ_LABEL={'mensal':'Mensal','bimestral':'Bimestral','trimestral':'Trimestral','nenhuma':'Sem captação'};

// ── PAUTA STATE ───────────────────────────────────────
let pautaView = 'sprint';
let pautaWeekStart = null; // Monday Date of selected week

function getMonday(d) {
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
}

function setPautaView(v) {
  pautaView = v;
  document.getElementById('vbtn-sprint').classList.toggle('active', v==='sprint');
  document.getElementById('vbtn-month').classList.toggle('active', v==='month');
  document.getElementById('pt-sprint-outer').style.display = v==='sprint' ? 'block' : 'none';
  document.getElementById('pt-month-outer').style.display = v==='month' ? 'block' : 'none';
  renderPauta();
}

function pautaShift(d) {
  if (pautaView === 'sprint') {
    pautaWeekStart = new Date(pautaWeekStart.getTime() + d * 7 * 86400000);
  } else {
    const dt = new Date(calY(), calM()-1+d, 1);
    document.getElementById('cal-month').value = `${dt.getFullYear()}-${z(dt.getMonth()+1)}`;
  }
  renderPauta();
}

function pautaToday() {
  pautaWeekStart = getMonday(new Date());
  const n = new Date();
  document.getElementById('cal-month').value = `${n.getFullYear()}-${z(n.getMonth()+1)}`;
  renderPauta();
}

function renderPauta() {
  if (pautaView === 'sprint') renderPautaSprint();
  else renderPautaMonth();
  renderCapAlerts();
}

function renderCapAlerts() {
  const Y=calY(), M=calM();
  const capClients=clients.filter(c=>c.type==='mrr'&&c.capFreq&&c.capFreq!=='nenhuma');
  const alerts=[];
  capClients.forEach(c=>{
    const last=c.lastCap;
    if(!last){alerts.push({c,status:'due'});return;}
    const[ly,lm]=last.split('-').map(Number);
    const monthsSince=(Y-ly)*12+(M-lm);
    const freq={mensal:1,bimestral:2,trimestral:3}[c.capFreq]||1;
    const due=monthsSince>=freq,soon=monthsSince===freq-1;
    if(due||soon)alerts.push({c,status:due?'due':'soon'});
  });
  const alertEl=document.getElementById('cap-alert');
  if(alerts.length){
    alertEl.style.display='flex';
    alertEl.innerHTML=`<span style="color:#92400e;font-weight:700;font-size:10px">🎥 CAPTAÇÕES:</span> `+
      alerts.map(a=>{
        const lbl=a.status==='due'?`🔴 ${a.c.name} — captação atrasada (${CAP_FREQ_LABEL[a.c.capFreq]})`:`🟡 ${a.c.name} — captação próxima`;
        return`<span class="cap-alert-item" onclick="openClientModal('${a.c.id}')" title="Ver cliente">${lbl}</span>`;
      }).join('');
  }else{alertEl.style.display='none';}
}

// ── SPRINT VIEW ───────────────────────────────────────
function renderPautaSprint() {
  const todayStr = dstr(new Date());
  const DOW_FULL = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const HALF = 4; // 4h per period

  const days = Array.from({length:7}, (_,i) =>
    new Date(pautaWeekStart.getTime() + i * 86400000)
  );

  // Label
  const d0=days[0], d6=days[6];
  const sameM = d0.getMonth()===d6.getMonth();
  const lbl = sameM
    ? `${PT_M[d0.getMonth()]} ${d0.getFullYear()} · ${d0.getDate()}–${d6.getDate()}`
    : `${d0.getDate()} ${PT_M[d0.getMonth()].slice(0,3)} – ${d6.getDate()} ${PT_M[d6.getMonth()].slice(0,3)} ${d6.getFullYear()}`;
  document.getElementById('cal-lbl').textContent = lbl;

  // Sync cal-month hidden input so month view stays in sync
  document.getElementById('cal-month').value = `${d0.getFullYear()}-${z(d0.getMonth()+1)}`;

  // Header row
  let hHtml = '<div class="pt-spr-hlabel">Equipe</div><div class="pt-spr-hdays">';
  for (const day of days) {
    const dow = day.getDay();
    const we = dow===0||dow===6;
    const isToday = dstr(day)===todayStr;
    hHtml += `<div class="pt-spr-hday${we?' we':''}${isToday?' today-col':''}">
      <span class="dc-dow">${DOW_FULL[dow]}</span>
      <span class="dc-num">${day.getDate()}</span>
    </div>`;
  }
  hHtml += '</div>';
  document.getElementById('pt-spr-header').innerHTML = hHtml;

  // Helper: build card HTML for a block
  function makeCard(b, p, dayD) {
    const t = T(b.k);
    const short = b.label.length>14 ? b.label.slice(0,13)+'…' : b.label;
    return `<button class="pt-card p-${b.k}"
      onclick="openPBModal(event,'${p.id}',${dayD},'${b.id}')"
      title="${ea(b.label+(b.hrs?' — '+b.hrs+'h':''))}">
      <span class="ci">${t.i}</span><span class="cn">${eh(short)}</span>${b.hrs?`<span class="ch">${b.hrs}h</span>`:''}
    </button>`;
  }

  // Person rows
  let rHtml = '';
  for (const p of pautaPersons) {
    const bs = pautaBlocks.filter(b => b.pid === p.id);
    let cellsHtml = '';
    for (const day of days) {
      const dow = day.getDay();
      const we = dow===0||dow===6;
      const isToday = dstr(day)===todayStr;
      const dayD = day.getDate();

      // Match blocks by day number only (blocks are always for the active month)
      const dayBs = bs.filter(b => b.d1<=dayD && b.d2>=dayD);
      const manhaBs = dayBs.filter(b => b.period==='manha');
      const tardeBs  = dayBs.filter(b => b.period==='tarde');
      // unassigned blocks: put them in manha by default
      const unassigned = dayBs.filter(b => !b.period);
      const allManha = [...manhaBs, ...unassigned];

      const manhaHrs = allManha.reduce((s,b)=>s+(b.hrs||0),0);
      const tardeHrs  = tardeBs.reduce((s,b)=>s+(b.hrs||0),0);
      const manhaHrsCls = manhaHrs>HALF?'ov':manhaHrs===HALF?'f':'';
      const tardeHrsCls  = tardeHrs>HALF?'ov':tardeHrs===HALF?'f':'';

      const manhaCards = allManha.map(b=>makeCard(b,p,dayD)).join('');
      const tardeCards  = tardeBs.map(b=>makeCard(b,p,dayD)).join('');

      cellsHtml += `<div class="pt-spr-cell${we?' we':''}${isToday?' today-col':''}">
        <div class="pt-period p-manha" onclick="if(!event.target.closest('.pt-card'))openPBModal(event,'${p.id}',${dayD},null,'manha')">
          <div class="pt-period-hdr">
            <span>Manhã</span>
            ${manhaHrs?`<span class="ph-hrs${manhaHrsCls?' '+manhaHrsCls:''}">${manhaHrs}h</span>`:''}
          </div>
          ${manhaCards}<div class="pt-add">+</div>
        </div>
        <div class="pt-period p-tarde" onclick="if(!event.target.closest('.pt-card'))openPBModal(event,'${p.id}',${dayD},null,'tarde')">
          <div class="pt-period-hdr">
            <span>Tarde</span>
            ${tardeHrs?`<span class="ph-hrs${tardeHrsCls?' '+tardeHrsCls:''}">${tardeHrs}h</span>`:''}
          </div>
          ${tardeCards}<div class="pt-add">+</div>
        </div>
      </div>`;
    }
    rHtml += `<div class="pt-spr-row">
      <div class="pt-spr-name">${eh(p.name)}</div>
      <div class="pt-spr-cells">${cellsHtml}</div>
    </div>`;
  }
  document.getElementById('pt-spr-rows').innerHTML = rHtml;
}

  for(let i=0;i<cells;i++){

    const cur=d.getMonth()+1===M;

    const isToday=ds===todayStr;
    const dayBs=cur?pautaBlocks.filter(b=>b.d1<=dn&&b.d2>=dn):[];
    const bigBs=dayBs.filter(b=>b.k==='big');

const SVC=['cap','plan','edit','des','rev'];

function nextCap(c){
  if(c.capFreq==='nenhuma'||!c.capFreq) return null;
  if(!c.lastCap) return 'Não agendada';
  const [y,m]=c.lastCap.split('-').map(Number);
  const freq={mensal:1,bimestral:2,trimestral:3}[c.capFreq];
  const nd=new Date(y,m-1+freq,1);
  return `${PT_M[nd.getMonth()]} ${nd.getFullYear()}`;
}

function capStatus(c){
  if(c.capFreq==='nenhuma'||!c.capFreq) return null;
  if(!c.lastCap) return 'due';
  const now=new Date();
  const [y,m]=c.lastCap.split('-').map(Number);
  const monthsSince=(now.getFullYear()-y)*12+(now.getMonth()+1-m);
  const freq={mensal:1,bimestral:2,trimestral:3}[c.capFreq];
  if(monthsSince>=freq) return 'due';
  if(monthsSince===freq-1) return 'soon';
  return 'ok';
}

let clFilter = 'all';
let clSort = {key:'name', asc:true};

function setClFilter(btn, f){
  clFilter = f;
  document.querySelectorAll('.cl-filter-btn').forEach(b=>b.classList.toggle('active', b===btn));
  renderClients();
}

function sortClients(key){
  if(clSort.key===key) clSort.asc=!clSort.asc;
  else { clSort.key=key; clSort.asc=true; }
  document.querySelectorAll('.cl-table th').forEach(th=>{
    th.classList.toggle('sorted', th.getAttribute('onclick')==='sortClients(\''+key+'\')');
  });
  renderClients();
}

function renderClients(){
  const q=(document.getElementById('cl-search')?.value||'').toLowerCase();

  let list=[...clients];

  if(clFilter==='mrr')     list=list.filter(c=>c.type==='mrr');
  if(clFilter==='tcv')     list=list.filter(c=>c.type==='tcv');
  if(clFilter==='cap-due') list=list.filter(c=>c.type==='mrr'&&capStatus(c)==='due');

  if(q) list=list.filter(c=>c.name.toLowerCase().includes(q)||(c.projectName||'').toLowerCase().includes(q));

  list.sort((a,b)=>{
    let va,vb;
    if(clSort.key==='name')     { va=a.name; vb=b.name; }
    else if(clSort.key==='type'){ va=a.type; vb=b.type; }
    else if(clSort.key==='total'){
      va=a.type==='mrr'?SVC.reduce((s,k)=>s+(a.hours[k]||0),0):a.cycleHours||0;
      vb=b.type==='mrr'?SVC.reduce((s,k)=>s+(b.hours[k]||0),0):b.cycleHours||0;
    }
    else if(clSort.key==='progress'){
      const pctA=a.type==='mrr'?SVC.reduce((s,k)=>s+(a.allocated[k]||0),0)/Math.max(SVC.reduce((s,k)=>s+(a.hours[k]||0),0),1):(a.allocatedHours||0)/Math.max(a.cycleHours||1,1);
      const pctB=b.type==='mrr'?SVC.reduce((s,k)=>s+(b.allocated[k]||0),0)/Math.max(SVC.reduce((s,k)=>s+(b.hours[k]||0),0),1):(b.allocatedHours||0)/Math.max(b.cycleHours||1,1);
      va=pctA; vb=pctB;
    }
    else if(clSort.key==='cap'){
      const order={due:0,soon:1,ok:2,null:3};
      va=order[capStatus(a)]??3; vb=order[capStatus(b)]??3;
    }
    else { va=a.name; vb=b.name; }
    if(va<vb) return clSort.asc?-1:1;
    if(va>vb) return clSort.asc?1:-1;
    return 0;
  });

  const totalMrr=clients.filter(c=>c.type==='mrr').length;
  const totalTcv=clients.filter(c=>c.type==='tcv').length;
  const capDue=clients.filter(c=>c.type==='mrr'&&capStatus(c)==='due').length;
  const totalHrs=clients.filter(c=>c.type==='mrr').reduce((s,c)=>s+SVC.reduce((ss,k)=>ss+(c.hours[k]||0),0),0);
  document.getElementById('cl-stats').innerHTML=`
    <span><strong>${totalMrr}</strong> MRR</span>
    <span><strong>${totalTcv}</strong> TCV</span>
    <span><strong>${totalHrs}h</strong>/ciclo</span>
    ${capDue?`<span style="color:#f87171"><strong>${capDue}</strong> cap. pendente</span>`:''}
  `;

  let html='';
  const mrrList=list.filter(c=>c.type==='mrr');
  const tcvList=list.filter(c=>c.type==='tcv');

  if(mrrList.length){
    html+=`<tr class="cl-section-row"><td colspan="7">Recorrentes — MRR</td></tr>`;
    html+=mrrList.map(c=>{
      const tot=SVC.reduce((s,k)=>s+(c.hours[k]||0),0);
      const alc=SVC.reduce((s,k)=>s+(c.allocated[k]||0),0);
      const pct=tot>0?alc/tot:0;
      const pfCls=pct>1?'pf-over':pct>.8?'pf-warn':'pf-ok';
      const plCls=pct>1?'pl-over':pct>.8?'pl-warn':'pl-ok';

      const chips=SVC.map(k=>{
        const h=c.hours[k]||0; if(!h) return '';
        const t=T(k);
        return `<span class="hrs-chip p-${k}" title="${t.l}">${t.i}${h}h</span>`;
      }).join('');

      const cs=capStatus(c);
      const nc=nextCap(c);
      const capDot=`<div class="cap-status cap-${cs||'none'}">
        <div class="cap-dot"></div>
        <span class="cap-txt">${CAP_FREQ_LABEL[c.capFreq]||'—'}</span>
        ${nc&&cs!=='none'?`<span class="cap-next">· ${nc}</span>`:''}
      </div>`;

      return `<tr class="mrr-row">
        <td><div class="cl-name">${eh(c.name)}</div></td>
        <td><span class="pill p-mrr">MRR</span></td>
        <td><div class="hrs-chips">${chips||'<span style="color:#334155;font-size:10px">—</span>'}</div></td>
        <td style="font-weight:700;color:#94a3b8">${tot}h</td>
        <td><div class="prog-wrap">
          <div class="prog-bar"><div class="prog-fill ${pfCls}" style="width:${Math.min(pct*100,100).toFixed(0)}%"></div></div>
          <span class="prog-lbl ${plCls}">${alc}/${tot}h</span>
        </div></td>
        <td>${capDot}</td>
        <td><button class="row-action" onclick="openClientModal('${c.id}')">✏️ Editar</button></td>
      </tr>`;
    }).join('');
  }

  if(tcvList.length){
    html+=`<tr class="cl-section-row"><td colspan="7">Projetos Pontuais — TCV</td></tr>`;
    html+=tcvList.map(c=>{
      const pct=c.cycleHours>0?(c.allocatedHours||0)/c.cycleHours:0;
      const pfCls=pct>1?'pf-over':pct>.8?'pf-warn':'pf-ok';
      const plCls=pct>1?'pl-over':pct>.8?'pl-warn':'pl-ok';
      const st=T(c.svcType||'other');
      const dl=c.deadline?`${PT_M[+c.deadline.split('-')[1]-1]} ${c.deadline.split('-')[0]}`:'—';

      return `<tr class="tcv-row">
        <td>
          <div class="cl-name">${eh(c.name)}</div>
          <div class="cl-sub">${st.i} ${eh(c.projectName||'')}</div>
        </td>
        <td><span class="pill p-tcv">TCV</span></td>
        <td><span style="font-size:10px;color:#64748b">${c.totalHours}h total · prazo ${dl}</span></td>
        <td style="font-weight:700;color:#818cf8">${c.cycleHours}h</td>
        <td><div class="prog-wrap">
          <div class="prog-bar"><div class="prog-fill ${pfCls}" style="width:${Math.min(pct*100,100).toFixed(0)}%"></div></div>
          <span class="prog-lbl ${plCls}">${c.allocatedHours||0}/${c.cycleHours}h</span>
        </div></td>
        <td><span style="color:#334155;font-size:11px">—</span></td>
        <td><button class="row-action" onclick="openClientModal('${c.id}')">✏️ Editar</button></td>
      </tr>`;
    }).join('');
  }

  if(!html) html=`<tr><td colspan="7" class="cl-empty">Nenhum cliente encontrado.</td></tr>`;

  document.getElementById('cl-tbody').innerHTML=html;
}

function dayFrac(d){ const s=Math.floor((d-1)/5); return (d+s-1)/23 }
function bStyle(d1,d2){
  const l=(dayFrac(d1)*100).toFixed(2);
  const w=((dayFrac(d2)+1/23-dayFrac(d1))*100).toFixed(2);
  return `left:${l}%;width:${w}%`;
}

function renderGantt(){
  const g=gantt;
  let html='';

  html+='<div class="g-sprints"><div class="gs-lbl"></div>';
  ['s1','s2','s3','s4'].forEach((c,i)=>{
    html+=`<div class="gs-spr ${c}">Sprint ${i+1}</div>`;
    if(i<3) html+='<div class="gs-sep"></div>';
  });
  html+='<div class="gs-lbl"></div></div>';

  html+='<div class="g-header"><div class="gh-lbl">Função</div>';
  for(let i=1;i<=20;i++){
    const f=(i-1)%5===0, l=i%5===0;
    html+=`<div class="gh-day${f?' fst':''}${l?' lst':''}">${z(i)}</div>`;
    if(l&&i<20) html+='<div class="gh-sep"></div>';
  }
  html+='<div class="gh-cap">Livre</div></div>';

  g.rows.forEach(row=>{
    const bs=g.blocks[row.id]||[];
    const filled=new Set();
    bs.forEach(b=>{for(let x=b.d1;x<=b.d2;x++)filled.add(x)});
    const free=20-filled.size;
    const hrs=bs.reduce((s,b)=>s+(b.hrs||0),0);
    const cls=free===0?'cx':free<=5?'cw':'cf';

    html+=`<div class="g-row">
      <div class="rn">
        <span class="rn-txt">${eh(row.name)}</span>
        <button class="rn-btn" onclick="openRowModal('${row.id}',event)">✏️</button>
      </div>
      <div class="row-days" id="rd-${row.id}">`;

    for(let i=1;i<=20;i++){
      html+=`<div class="day-cell" onclick="openBlockModal('${row.id}',${i},event)"></div>`;
      if(i%5===0&&i<20) html+='<div class="day-cell wsep"></div>';
    }

    html+='<div class="blocks-layer">';
    [...bs].sort((a,b)=>a.d1-b.d1).forEach(b=>{
      const t=T(b.k);
      html+=`<div class="block ${t.p}" style="${bStyle(b.d1,b.d2)}"
        onclick="openBlockModal('${row.id}',null,event,'${b.id}')"
        title="${ea([b.l,b.hrs?b.hrs+'h':''].filter(Boolean).join(' — '))}">
        <span class="b-icon">${t.i}</span>
        <span class="b-lbl">${eh(b.l)}</span>
        ${b.hrs?`<span class="b-hrs">${b.hrs}h</span>`:''}
      </div>`;
    });

    html+=`</div></div>
      <div class="cap-cell ${cls}">${free===0?'⛔':free+'d'}
        <span style="font-size:8px;color:#334155;display:block">${hrs?hrs+'h':''}</span>
      </div>
    </div>`;
  });

  document.getElementById('gantt-grid').innerHTML=html;
}

}

// ──────────────────────────────────────────────────────────
// MODAL: PAUTA BLOCK
// ──────────────────────────────────────────────────────────
let pbSelType=T('plan');
let editPBBlock=null;
let editPBPersonId=null;

function openPBModal(e,personId,day,blockId,defaultPeriod){
  e.stopPropagation();
  editPBPersonId=personId;
  editPBBlock=blockId?pautaBlocks.find(b=>b.id===blockId):null;
  const b=editPBBlock;
  document.getElementById('pb-title').textContent=b?'Editar Tarefa':'Nova Tarefa';
  document.getElementById('pb-label').value=b?.label||'';
  document.getElementById('pb-d1').value=b?.d1??day??1;
  document.getElementById('pb-d2').value=b?.d2??day??1;
  document.getElementById('pb-hrs').value=b?.hrs||'';
  document.getElementById('pb-notes').value=b?.notes||'';
  document.getElementById('pb-period').value=b?.period||defaultPeriod||'manha';
  document.getElementById('pb-del').style.display=b?'inline-flex':'none';
  const psel=document.getElementById('pb-person');
  psel.innerHTML=pautaPersons.map(p=>`<option value="${p.id}"${p.id===personId?' selected':''}>${p.name}</option>`).join('');
  if(b) psel.value=b.pid;
  pbSelType=T(b?.k||'plan');
  buildTSel('pb-tselector',pbSelType.k,'initPBTSel');
  document.getElementById('pb-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('pb-label').focus(),60);
}
function closePBModal(){document.getElementById('pb-overlay').classList.remove('open');editPBBlock=null;editPBPersonId=null}
function initPBTSel(k){pbSelType=T(k);buildTSel('pb-tselector',k,'initPBTSel')}
function savePBBlock(){
  const label=document.getElementById('pb-label').value.trim();
  if(!label){document.getElementById('pb-label').focus();return}
  let d1=+document.getElementById('pb-d1').value||1;
  let d2=+document.getElementById('pb-d2').value||1;
  if(d1>d2)[d1,d2]=[d2,d1];
  const wk=pautaWeekStart;
  const total=new Date(wk.getFullYear(),wk.getMonth()+1,0).getDate();
  d1=Math.max(1,Math.min(total,d1));d2=Math.max(1,Math.min(total,d2));
  const hrs=parseFloat(document.getElementById('pb-hrs').value)||0;
  const notes=document.getElementById('pb-notes').value.trim();
  const pid=document.getElementById('pb-person').value||editPBPersonId;
  const period=document.getElementById('pb-period').value||'manha';
  if(editPBBlock){Object.assign(editPBBlock,{label,d1,d2,k:pbSelType.k,hrs,notes,pid,period})}
  else{pautaBlocks.push({id:'pb'+Date.now(),pid,d1,d2,label,k:pbSelType.k,hrs,notes,period})}
  closePBModal();renderPauta();
}
function deletePBBlock(){
  if(!editPBBlock||!confirm(`Excluir "${editPBBlock.label}"?`))return;
  pautaBlocks=pautaBlocks.filter(b=>b.id!==editPBBlock.id);
  closePBModal();renderPauta();
}

// ──────────────────────────────────────────────────────────
// TYPE SELECTOR
// ──────────────────────────────────────────────────────────
function buildTSel(containerId,selK,selFn){
  document.getElementById(containerId).innerHTML=TYPES.map(t=>
    `<button class="tbtn ${t.p}${t.k===selK?' sel':''}" onclick="${selFn}('${t.k}')">${t.i} ${t.l}</button>`
  ).join('');
}
function initEvTSel(k){evSelType=T(k);buildTSel('ev-tselector',k,'initEvTSel')}
function initBlTSel(k){blSelType=T(k);buildTSel('block-tselector',k,'initBlTSel')}

// ──────────────────────────────────────────────────────────
// TABS
// ──────────────────────────────────────────────────────────
function switchTab(tab){
  curTab=tab;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['cal','clients','meta'][i]===tab));
  document.getElementById('cal-section').style.display=tab==='cal'?'block':'none';
  document.getElementById('clients-section').style.display=tab==='clients'?'block':'none';
  document.getElementById('meta-section').style.display=tab==='meta'?'block':'none';
  document.getElementById('cal-month').style.display=tab==='cal'?'inline-block':'none';
  document.getElementById('btn-add-event').style.display='none';
  document.getElementById('btn-add-client').style.display=tab==='clients'?'inline-flex':'none';
  document.getElementById('btn-add-row').style.display=tab==='meta'?'inline-flex':'none';
  if(tab==='cal'){
    if(!pautaWeekStart) pautaWeekStart=getMonday(new Date());
    renderPauta();return;
  }
  if(tab==='clients'){renderClients();return}
  renderGantt();
}

// ──────────────────────────────────────────────────────────
// UTILS
// ──────────────────────────────────────────────────────────
function eh(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function ea(s){return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function exportHint(){alert('No sistema final: exportar como PDF.\nPor enquanto use Ctrl+P. 📄')}

// ──────────────────────────────────────────────────────────
// KEYBOARD
// ──────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeEvModal();closeClientModal();closeBlockModal();closeRowModal();closePBModal()}
});

// ──────────────────────────────────────────────────────────
// PEOPLE SELECTS
// ──────────────────────────────────────────────────────────
function populatePeople(){
  const el=document.getElementById('ev-person');
  if(el) el.innerHTML='<option value="">—</option>'+PESSOAS.map(p=>`<option value="${p}">${p}</option>`).join('');
}

// ──────────────────────────────────────────────────────────
// INIT
// ──────────────────────────────────────────────────────────
populatePeople();
pautaWeekStart = getMonday(new Date());
switchTab('cal');
</script>
